openapi: 3.0.3

info:
  title: API Manajemen Barbershop
  version: 1.0.0
  description: |
    Dokumentasi REST API untuk aplikasi KATAJI Barber
    (transaksi, layanan, pelanggan, pengeluaran, dan rekap pemasukan).
    Disusun sesuai kode di folder `api/` dan skema database `kataji_barber`.

    ## Autentikasi
    API memakai **session PHP berbasis cookie** (`PHPSESSID`), bukan token Bearer.

    1. Panggil `POST /auth/login.php` — server mengirim cookie sesi.
    2. Browser otomatis mengirim cookie itu di request berikutnya
       (pada Swagger UI ini cukup login lewat *Try it out*, lalu endpoint lain bisa dicoba).
    3. Sesi **berakhir otomatis setelah 30 menit tanpa aktivitas**
       (`401` dengan `error_code: UNAUTHORIZED`). Setiap request yang berhasil
       memperpanjang sesi.

    ## Role
    | Role | Hak akses |
    |---|---|
    | `owner` | Semua endpoint |
    | `barber` | Mencatat transaksi, melihat transaksi miliknya, mencari pelanggan, melihat daftar barber |

    ## Format respons
    Semua respons berupa JSON UTF-8 dengan bentuk dasar:
    ```json
    { "success": true, "message": "...", "data": { } }
    ```
    Respons error:
    ```json
    { "success": false, "message": "...", "error_code": "UNPROCESSABLE_ENTITY" }
    ```

    ### Aturan `error_code`
    `error_code` selalu berupa **nama status HTTP**-nya, dan ada di setiap respons error.
    Penjelasan penyebab yang lebih spesifik ada di `message`.

    | HTTP | `error_code` |
    |---|---|
    | 400 | `BAD_REQUEST` |
    | 401 | `UNAUTHORIZED` |
    | 403 | `FORBIDDEN` |
    | 404 | `NOT_FOUND` |
    | 405 | `METHOD_NOT_ALLOWED` |
    | 409 | `CONFLICT` |
    | 415 | `UNSUPPORTED_MEDIA_TYPE` |
    | 422 | `UNPROCESSABLE_ENTITY` |
    | 500 | `INTERNAL_SERVER_ERROR` |

    ## Zona waktu
    Semua tanggal "hari ini" dihitung memakai zona **Asia/Jakarta (WIB)**.

  contact:
    name: Pengembang API

servers:
  - url: "{baseUrl}"
    description: Base URL folder api
    variables:
      baseUrl:
        default: /KELOMPOK-5/api
        description: >
          Ubah sesuai lokasi folder `api` di server, mis.
          `http://localhost:8080/KELOMPOK-5/api` atau `https://domain-anda.com/api`.

tags:
  - name: Auth
    description: Login dan pengecekan sesi
  - name: Layanan
    description: Master layanan (potong rambut, dll). GET publik, selain itu khusus owner
  - name: Transaksi
    description: Pencatatan dan riwayat transaksi
  - name: Pelanggan
    description: Pencarian dan penghapusan (soft delete) pelanggan
  - name: Barber
    description: Daftar barber aktif
  - name: Pengeluaran
    description: Pencatatan pengeluaran harian (khusus owner)
  - name: Rekap
    description: Rekap dan tren pemasukan (khusus owner)

security:
  - sessionCookie: []

paths:
  # ===========================================================================
  # AUTH
  # ===========================================================================
  /auth/login.php:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Memverifikasi username & password, lalu membuat sesi (cookie `PHPSESSID`).
        Hanya akun dengan `aktif = 1` yang bisa login.
        Request **wajib** `Content-Type: application/json`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: erik
              password: password_pengguna
      responses:
        "200":
          description: Login berhasil. Cookie sesi dikirim lewat header `Set-Cookie`.
          headers:
            Set-Cookie:
              description: Cookie sesi PHP
              schema:
                type: string
                example: PHPSESSID=abc123; path=/; HttpOnly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Body bukan JSON yang valid (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: Format JSON tidak valid.,
                  error_code: BAD_REQUEST,
                }
        "401":
          description: Username atau password salah (`UNAUTHORIZED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: Username atau password salah.,
                  error_code: UNAUTHORIZED,
                }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415":
          description: Content-Type bukan `application/json` (`UNSUPPORTED_MEDIA_TYPE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Username/password kosong (`UNPROCESSABLE_ENTITY`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /auth/me.php:
    get:
      tags: [Auth]
      summary: Cek sesi login
      description: Mengembalikan identitas pengguna dari sesi aktif. Berguna untuk memeriksa apakah sesi masih valid.
      operationId: me
      responses:
        "200":
          description: Sesi valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Sesi login valid. }
                  data:
                    type: object
                    properties:
                      id_user: { type: integer, example: 1 }
                      nama: { type: string, nullable: true, example: Budi }
                      role: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ===========================================================================
  # LAYANAN
  # ===========================================================================
  /layanan/index.php:
    get:
      tags: [Layanan]
      summary: Daftar semua layanan
      description: |
        Mengambil seluruh layanan, **termasuk yang nonaktif** (`aktif = 0`), urut `id_layanan` menurun.

        > ⚠️ Endpoint ini **tidak memerlukan login**. Hanya POST/PUT/PATCH/DELETE yang dibatasi owner.
      operationId: listLayanan
      security: []
      responses:
        "200":
          description: Daftar layanan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Layanan" }
        "500": { $ref: "#/components/responses/ServerError" }

    post:
      tags: [Layanan]
      summary: Tambah layanan (owner)
      description: |
        Menambah layanan baru dengan status aktif. Bisa dikirim sebagai **JSON** atau
        **multipart/form-data** (bila ingin mengunggah ikon).

        Ikon: JPG/PNG/WebP, maksimal **2 MB**, field file bernama `icon_layanan`.
      operationId: createLayanan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LayananInput" }
            example: { nama_layanan: Potong Rambut, harga: 35000, hpp: 5000 }
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/LayananInput"
                - type: object
                  properties:
                    icon_layanan:
                      type: string
                      format: binary
                      description: File ikon (JPG/PNG/WebP, maks 2 MB)
      responses:
        "201":
          description: Layanan ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: Layanan berhasil ditambahkan. }
                  data: { $ref: "#/components/schemas/Layanan" }
        "400":
          description: Body bukan JSON valid (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOwner" }
        "422":
          description: |
            Validasi gagal (`UNPROCESSABLE_ENTITY`). Field yang salah dijelaskan di `message` (nama, harga, HPP, atau ikon layanan).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: Harga harus berupa bilangan bulat lebih dari nol.,
                  error_code: UNPROCESSABLE_ENTITY,
                }
        "500": { $ref: "#/components/responses/ServerError" }

    put:
      tags: [Layanan]
      summary: Edit layanan (owner)
      description: |
        Mengubah nama, harga, HPP, dan (opsional) ikon layanan. Layanan nonaktif tetap bisa diedit.
        `id_layanan` dikirim di **body**, bukan di URL.

        **Catatan upload ikon:** PHP tidak mengisi `$_FILES` untuk request `PUT` asli.
        Untuk mengganti ikon, kirim **`POST` multipart/form-data** ke URL yang sama dengan
        field tambahan `_method=PUT`. Bila `icon_layanan` tidak dikirim, ikon lama dipertahankan.
        Ikon lama dihapus dari server setelah update database berhasil.
      operationId: updateLayanan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LayananUpdate" }
            example:
              {
                id_layanan: 3,
                nama_layanan: Potong Rambut Premium,
                harga: 50000,
                hpp: 8000,
              }
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/LayananUpdate"
                - type: object
                  properties:
                    _method:
                      type: string
                      enum: [PUT]
                      description: Wajib bernilai `PUT` bila dikirim lewat metode POST
                    icon_layanan:
                      type: string
                      format: binary
                      description: Ikon baru (JPG/PNG/WebP, maks 2 MB)
      responses:
        "200":
          description: Layanan diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: Layanan berhasil diperbarui. }
                  data:
                    type: object
                    properties:
                      id_layanan: { type: integer, example: 3 }
                      nama_layanan:
                        { type: string, example: Potong Rambut Premium }
                      harga: { type: integer, example: 50000 }
                      hpp: { type: integer, example: 8000 }
                      icon_layanan:
                        {
                          type: string,
                          nullable: true,
                          example: uploads/layanan/9f2c1e.png,
                        }
        "400":
          description: Body bukan JSON valid (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOwner" }
        "404":
          description: Layanan tidak ditemukan (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            Validasi gagal (`UNPROCESSABLE_ENTITY`): ID, nama, harga, HPP, atau ikon tidak valid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

    patch:
      tags: [Layanan]
      summary: Aktifkan / nonaktifkan layanan (owner)
      description: |
        Hanya mengubah status `aktif`. Hanya menerima **JSON**.
        Bila field `aktif` tidak dikirim, nilainya dianggap `0` (nonaktif).
      operationId: toggleLayanan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_layanan]
              properties:
                id_layanan: { type: integer, minimum: 1, example: 3 }
                aktif:
                  type: integer
                  enum: [0, 1]
                  default: 0
                  description: "`1` = aktif, `0` = nonaktif"
                  example: 0
      responses:
        "200":
          description: Status diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: Layanan berhasil dinonaktifkan. }
        "400":
          description: Body bukan JSON valid (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOwner" }
        "404":
          description: Layanan tidak ditemukan (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: ID atau status aktif tidak valid (`UNPROCESSABLE_ENTITY`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

    delete:
      tags: [Layanan]
      summary: Hapus layanan permanen (owner)
      description: |
        Menghapus layanan **secara permanen** beserta file ikonnya. `id_layanan` dikirim di **body JSON**.

        Riwayat transaksi tetap utuh karena `detail_transaksi` menyimpan snapshot nama, harga, dan HPP.
        Pada baris detail yang layanannya dihapus, `id_layanan` menjadi `null`.
      operationId: deleteLayanan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_layanan]
              properties:
                id_layanan: { type: integer, minimum: 1, example: 3 }
      responses:
        "200":
          description: Layanan dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    {
                      type: string,
                      example: Layanan berhasil dihapus permanen.,
                    }
        "400":
          description: Body bukan JSON valid (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOwner" }
        "404":
          description: Layanan tidak ditemukan (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: ID tidak valid (`UNPROCESSABLE_ENTITY`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ===========================================================================
  # TRANSAKSI
  # ===========================================================================
  /transaksi/index.php:
    get:
      tags: [Transaksi]
      summary: Daftar transaksi
      description: |
        - **barber**: hanya transaksi yang dicatat oleh akunnya (`id_pencatat`); bila `tanggal` kosong, otomatis hari ini (WIB).
        - **owner**: semua transaksi; bila `tanggal` kosong, menampilkan **semua tanggal**.

        Transaksi yang sudah dihapus (soft delete) tidak ditampilkan. Urut terbaru lebih dulu.
      operationId: listTransaksi
      parameters:
        - $ref: "#/components/parameters/Tanggal"
      responses:
        "200":
          description: Daftar transaksi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TransaksiRingkas" }
        "400":
          description: Format tanggal salah (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role tidak diizinkan (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

    post:
      tags: [Transaksi]
      summary: Catat transaksi baru
      description: |
        Mencatat transaksi beserta rincian layanan dalam satu database transaction.

        - **Harga & HPP diambil dari database** (bukan dari client) lalu disimpan sebagai snapshot.
        - Layanan yang sama dikirim berulang akan **digabung**; total jumlah per layanan maksimal **100**.
        - Hanya layanan **aktif** yang bisa dipakai.
        - **barber**: `id_barber` diabaikan, otomatis diisi ID akun sendiri.
        - **owner**: `id_barber` **wajib** diisi (barber/owner aktif).
        - **Pelanggan:** bila `id_pelanggan` diisi → memakai pelanggan tersebut (tidak membuat data ganda); bila kosong → dibuat pelanggan baru dari `nama_pelanggan`.
        - `nama_pelanggan` **wajib** diisi (tidak boleh kosong/spasi saja) walaupun `id_pelanggan` dikirim. Jika kosong → `422` dengan pesan `Nama pelanggan wajib diisi.`
        - `id_pelanggan` yang tidak ada → `422` dengan pesan `Pelanggan yang dipilih tidak ditemukan.`
        - Field `no_hp` **tidak diproses** endpoint ini; pelanggan baru disimpan hanya dengan nama.
        - Total harga maksimal 2.147.483.647.
        - `nama_pelanggan` maksimal 100 karakter.
        - Tanggal dan waktu transaksi diisi server (WIB).
      operationId: createTransaksi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransaksiCreate" }
            example:
              nama_pelanggan: Andi
              id_pelanggan: null
              id_barber: 2
              metode_pembayaran: qris
              layanan:
                - { id_layanan: 1, jumlah: 1 }
                - { id_layanan: 4, jumlah: 2 }
      responses:
        "201":
          description: Transaksi tercatat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: Transaksi berhasil dicatat. }
                  data: { $ref: "#/components/schemas/TransaksiCreated" }
        "400":
          description: Body bukan JSON valid (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role tidak diizinkan (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            Validasi gagal (`UNPROCESSABLE_ENTITY`): nama pelanggan, metode bayar, layanan, jumlah, atau barber tidak valid. Penyebab pastinya ada di `message`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                namaKosong:
                  summary: Nama pelanggan dikosongkan
                  value:
                    {
                      success: false,
                      message: Nama pelanggan wajib diisi.,
                      error_code: UNPROCESSABLE_ENTITY,
                    }
                pelangganTidakAda:
                  summary: id_pelanggan tidak ditemukan
                  value:
                    {
                      success: false,
                      message: Pelanggan yang dipilih tidak ditemukan.,
                      error_code: UNPROCESSABLE_ENTITY,
                    }
                metodeBayar:
                  summary: Metode pembayaran tidak valid
                  value:
                    {
                      success: false,
                      message: Pilih metode pembayaran yang valid.,
                      error_code: UNPROCESSABLE_ENTITY,
                    }
        "500": { $ref: "#/components/responses/ServerError" }

    delete:
      tags: [Transaksi]
      summary: Hapus riwayat transaksi (owner, soft delete)
      description: |
        Mengisi `dihapus_pada` pada transaksi (data tidak benar-benar dihapus).
        ID dikirim lewat **query string** `?id=`.
        Setara dengan `POST /transaksi/hapus.php`.
      operationId: deleteTransaksi
      parameters:
        - name: id
          in: query
          required: true
          description: ID transaksi
          schema: { type: integer, minimum: 1, example: 15 }
      responses:
        "200":
          description: Transaksi dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    {
                      type: string,
                      example: Riwayat transaksi berhasil dihapus.,
                    }
        "400":
          description: ID tidak valid (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOwner" }
        "404":
          description: Tidak ditemukan atau sudah dihapus (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /transaksi/detail.php:
    get:
      tags: [Transaksi]
      summary: Detail transaksi
      description: |
        Detail satu transaksi beserta rincian layanan.
        **barber** hanya bisa melihat transaksi yang ia catat sendiri (`id_pencatat`), selain itu `404`.
        Transaksi yang sudah dihapus (soft delete) juga menghasilkan `404`.
      operationId: detailTransaksi
      parameters:
        - name: id
          in: query
          required: true
          description: ID transaksi
          schema: { type: integer, minimum: 1, example: 15 }
      responses:
        "200":
          description: Detail transaksi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/TransaksiDetail" }
        "400":
          description: ID tidak valid atau tidak dikirim (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role tidak diizinkan (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Transaksi tidak ditemukan (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /transaksi/hapus.php:
    delete:
      tags: [Transaksi]
      summary: Hapus riwayat transaksi (owner, soft delete)
      description: |
        Endpoint alternatif untuk soft delete transaksi, khusus owner. Setara dengan
        `DELETE /transaksi/index.php?id=`, tetapi nama parameternya `id_transaksi`.

        ID dikirim lewat **query string** (`?id_transaksi=15`) atau **body JSON**
        (`{"id_transaksi": 15}`); query diprioritaskan.
      operationId: hapusTransaksiAlt
      parameters:
        - name: id_transaksi
          in: query
          required: false
          description: "ID transaksi (alternatif: kirim di body JSON)"
          schema: { type: integer, minimum: 1, example: 15 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id_transaksi: { type: integer, minimum: 1, example: 15 }
      responses:
        "200":
          description: Transaksi dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    {
                      type: string,
                      example: Riwayat transaksi berhasil dihapus.,
                    }
        "400":
          description: ID tidak valid atau tidak dikirim (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: ID transaksi tidak valid.,
                  error_code: BAD_REQUEST,
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOwner" }
        "404":
          description: Tidak ditemukan atau sudah dihapus (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ===========================================================================
  # PELANGGAN
  # ===========================================================================
  /pelanggan/index.php:
    get:
      tags: [Pelanggan]
      summary: Cari pelanggan berdasarkan nama
      description: |
        Bila `q` diisi (minimal 2 karakter): pencarian nama (`LIKE %q%`), maksimal **100** hasil, urut nama A–Z.
        Bila `q` diisi tetapi kurang dari 2 karakter, mengembalikan array kosong (bukan error).
        Bila `q` kosong/tidak dikirim, mengembalikan daftar pelanggan (maksimal 100) untuk tabel.
        Data hanya berisi `id_pelanggan` dan `nama`.
        Untuk saran nama (autocomplete) di form transaksi: bila kasir memilih salah satu saran,
        kirim `id_pelanggan`-nya pada `POST /transaksi/index.php` agar transaksi tertaut ke
        pelanggan yang sama (bukan data ganda).
      operationId: cariPelanggan
      parameters:
        - name: q
          in: query
          required: false
          description: Kata kunci nama (minimal 2 karakter; kosong = daftar semua pelanggan)
          schema: { type: string, example: And }
      responses:
        "200":
          description: Hasil pencarian
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/Pelanggan" }
              examples:
                adaHasil:
                  summary: q=And
                  value:
                    { success: true, data: [{ id_pelanggan: 7, nama: Andi }] }
                kosong:
                  summary: q kurang dari 2 karakter atau tidak ada yang cocok
                  value: { success: true, data: [] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role tidak diizinkan (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: Role tidak diizinkan.,
                  error_code: FORBIDDEN,
                }
        "405":
          description: "Metode selain GET/DELETE (`METHOD_NOT_ALLOWED`, header `Allow: GET, DELETE`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Gagal mencari pelanggan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Pelanggan]
      summary: Hapus pelanggan (soft delete)
      description: |
        **Hanya owner.** Pelanggan tidak dihapus dari database, hanya diberi tanda `dihapus_pada`.
        Riwayat transaksi lama tetap menampilkan nama pelanggan tersebut, tetapi pelanggan itu tidak lagi
        muncul di saran nama dan tidak bisa dipilih untuk transaksi baru (`POST /transaksi/index.php`
        dengan `id_pelanggan`-nya ditolak `422`).
        ID dibaca dari query `?id=` atau body JSON `{"id_pelanggan": 7}`.
      operationId: hapusPelanggan
      parameters:
        - name: id
          in: query
          required: false
          description: "ID pelanggan (alternatif: body JSON `id_pelanggan`)"
          schema: { type: integer, minimum: 1, example: 7 }
      responses:
        "200":
          description: Pelanggan berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: Pelanggan berhasil dihapus. }
        "400":
          description: ID tidak dikirim atau tidak valid (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: ID pelanggan tidak valid.,
                  error_code: BAD_REQUEST,
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Bukan owner (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: Hanya owner yang dapat menghapus pelanggan.,
                  error_code: FORBIDDEN,
                }
        "404":
          description: Pelanggan tidak ditemukan atau sudah dihapus (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: Pelanggan tidak ditemukan.,
                  error_code: NOT_FOUND,
                }
        "500":
          description: Gagal memproses data pelanggan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ===========================================================================
  # RIWAYAT LAYANAN PER PELANGGAN
  # ===========================================================================
  /riwayat/pelanggan.php:
    get:
      tags: [Pelanggan]
      summary: Riwayat layanan satu pelanggan
      description: |
        Daftar layanan yang pernah diambil satu pelanggan, **satu baris per layanan** pada setiap
        transaksi (transaksi multi-layanan muncul sebagai beberapa baris dengan `id_transaksi` yang sama).
        Diurutkan dari yang terbaru (`tanggal`, lalu `waktu`, lalu `id_transaksi` menurun).

        - Role `owner` dan `barber`; barber dapat melihat semua transaksi pelanggan tersebut.
        - Transaksi yang sudah dihapus (soft delete) tidak ikut.
        - `nama_layanan` berasal dari snapshot saat transaksi.
        - Pelanggan yang belum pernah bertransaksi mengembalikan `200` dengan `riwayat` kosong dan `ada_data: false` (bukan error).
        - Pelanggan yang tidak ada atau sudah dihapus mengembalikan `404`.
      operationId: riwayatLayananPelanggan
      parameters:
        - name: id_pelanggan
          in: query
          required: true
          description: ID pelanggan
          schema: { type: integer, minimum: 1, example: 7 }
      responses:
        "200":
          description: Riwayat layanan pelanggan (dapat kosong)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/RiwayatPelanggan" }
              examples:
                adaRiwayat:
                  summary: Pelanggan dengan transaksi multi-layanan
                  value:
                    success: true
                    data:
                      pelanggan: { id_pelanggan: 7, nama: Andi }
                      jumlah_kunjungan: 2
                      riwayat:
                        - {
                            id_transaksi: 12,
                            tanggal: "2026-10-25",
                            waktu: "15:30:00",
                            id_layanan: 2,
                            nama_layanan: Coloring,
                            jumlah: 1,
                          }
                        - {
                            id_transaksi: 12,
                            tanggal: "2026-10-25",
                            waktu: "15:30:00",
                            id_layanan: 3,
                            nama_layanan: Creambath,
                            jumlah: 2,
                          }
                        - {
                            id_transaksi: 10,
                            tanggal: "2026-10-20",
                            waktu: "09:00:00",
                            id_layanan: 1,
                            nama_layanan: Potong rambut reguler,
                            jumlah: 1,
                          }
                      ada_data: true
                pelangganBaru:
                  summary: Pelanggan belum punya transaksi
                  value:
                    success: true
                    data:
                      pelanggan: { id_pelanggan: 8, nama: Pelanggan Baru }
                      jumlah_kunjungan: 0
                      riwayat: []
                      ada_data: false
        "400":
          description: "`id_pelanggan` tidak dikirim atau tidak valid (`BAD_REQUEST`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: ID pelanggan tidak valid.,
                  error_code: BAD_REQUEST,
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role tidak diizinkan (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Pelanggan tidak ditemukan atau sudah dihapus (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: Pelanggan tidak ditemukan.,
                  error_code: NOT_FOUND,
                }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ===========================================================================
  # BARBER
  # ===========================================================================
  /barber/index.php:
    get:
      tags: [Barber]
      summary: Daftar barber aktif
      description: Pengguna aktif dengan role `barber` atau `owner`, urut nama A–Z. Dipakai owner untuk memilih barber saat mencatat transaksi.
      operationId: listBarber
      responses:
        "200":
          description: Daftar barber
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id_user: { type: integer, example: 2 }
                        nama: { type: string, example: Budi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ===========================================================================
  # PENGELUARAN
  # ===========================================================================
  /pengeluaran/index.php:
    get:
      tags: [Pengeluaran]
      summary: Daftar pengeluaran per tanggal (owner)
      description: Daftar pengeluaran pada satu tanggal beserta totalnya. Default hari ini (WIB).
      operationId: listPengeluaran
      parameters:
        - $ref: "#/components/parameters/Tanggal"
      responses:
        "200":
          description: Daftar pengeluaran
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      tanggal:
                        { type: string, format: date, example: "2026-10-25" }
                      pengeluaran:
                        type: array
                        items: { $ref: "#/components/schemas/Pengeluaran" }
                      total_pengeluaran: { type: integer, example: 150000 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOwner" }
        "422":
          description: Format tanggal salah (`UNPROCESSABLE_ENTITY`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

    post:
      tags: [Pengeluaran]
      summary: Catat pengeluaran (owner)
      description: |
        Aturan validasi:
        - `nominal`: bilangan bulat > 0 dan ≤ 2.147.483.647 (boleh berupa integer atau string angka; desimal ditolak)
        - `kategori`: wajib, maksimal 100 karakter
        - `tanggal`: opsional, default hari ini (WIB)
        - `keterangan`: opsional, maksimal 255 karakter (string kosong dianggap `null`)
      operationId: createPengeluaran
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PengeluaranInput" }
            example:
              kategori: Listrik
              nominal: 150000
              tanggal: "2026-10-25"
              keterangan: Token listrik bulan Oktober
      responses:
        "201":
          description: Pengeluaran tercatat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: Pengeluaran berhasil dicatat. }
                  data:
                    type: object
                    properties:
                      id_pengeluaran: { type: integer, example: 12 }
                      id_user: { type: integer, example: 1 }
                      tanggal:
                        { type: string, format: date, example: "2026-10-25" }
                      kategori: { type: string, example: Listrik }
                      nominal: { type: integer, example: 150000 }
                      keterangan:
                        {
                          type: string,
                          nullable: true,
                          example: Token listrik bulan Oktober,
                        }
        "400":
          description: Body bukan JSON valid (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOwner" }
        "422":
          description: Validasi gagal (`UNPROCESSABLE_ENTITY`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: Nominal harus lebih dari nol,
                  error_code: UNPROCESSABLE_ENTITY,
                }
        "500": { $ref: "#/components/responses/ServerError" }

    delete:
      tags: [Pengeluaran]
      summary: Hapus pengeluaran hari ini (owner)
      description: |
        Hanya pengeluaran bertanggal **hari ini (WIB)** yang boleh dihapus.
        `id_pengeluaran` bisa dikirim lewat **query string** atau **body JSON** (query diprioritaskan).
      operationId: deletePengeluaran
      parameters:
        - name: id_pengeluaran
          in: query
          required: false
          description: "ID pengeluaran (alternatif: kirim di body JSON)"
          schema: { type: integer, minimum: 1, example: 12 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id_pengeluaran: { type: integer, minimum: 1, example: 12 }
      responses:
        "200":
          description: Pengeluaran dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: Pengeluaran berhasil dihapus. }
                  data:
                    type: object
                    properties:
                      id_pengeluaran: { type: integer, example: 12 }
                      tanggal:
                        { type: string, format: date, example: "2026-10-25" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Bukan owner (`FORBIDDEN`) **atau** pengeluaran bukan milik hari ini (`FORBIDDEN`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  success: false,
                  message: Hanya pengeluaran hari ini yang dapat dihapus.,
                  error_code: FORBIDDEN,
                }
        "404":
          description: Pengeluaran tidak ditemukan (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Konflik saat menghapus, muat ulang data (`CONFLICT`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: ID tidak valid (`UNPROCESSABLE_ENTITY`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ===========================================================================
  # REKAP
  # ===========================================================================
  /rekap/pemasukan.php:
    get:
      tags: [Rekap]
      summary: Rekap pemasukan harian/mingguan/bulanan (owner)
      description: |
        Total pemasukan dan rincian per barber untuk satu periode. `tanggal` adalah tanggal acuan
        (default hari ini WIB) dan `periode` menentukan rentangnya:

        | `periode` | Rentang |
        |---|---|
        | `hari` (default) | Tanggal acuan saja |
        | `minggu` | Senin–Minggu yang memuat tanggal acuan |
        | `bulan` | Bulan kalender yang memuat tanggal acuan |

        Transaksi yang sudah dihapus tidak dihitung.
      operationId: rekapPemasukan
      parameters:
        - $ref: "#/components/parameters/Tanggal"
        - name: periode
          in: query
          required: false
          schema:
            type: string
            enum: [hari, minggu, bulan]
            default: hari
      responses:
        "200":
          description: Rekap pemasukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      periode:
                        {
                          type: string,
                          enum: [hari, minggu, bulan],
                          example: hari,
                        }
                      tanggal_acuan:
                        { type: string, format: date, example: "2026-10-25" }
                      tanggal_awal:
                        { type: string, format: date, example: "2026-10-25" }
                      tanggal_akhir:
                        { type: string, format: date, example: "2026-10-25" }
                      total_pemasukan: { type: integer, example: 420000 }
                      jumlah_transaksi: { type: integer, example: 12 }
                      ada_data:
                        {
                          type: boolean,
                          description: "`false` bila tidak ada transaksi pada rentang",
                          example: true,
                        }
                      rincian_per_barber:
                        type: array
                        items:
                          type: object
                          properties:
                            id_barber: { type: integer, example: 2 }
                            nama_barber: { type: string, example: Budi }
                            jumlah_transaksi: { type: integer, example: 8 }
                            total_pemasukan: { type: integer, example: 280000 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOwner" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "422":
          description: Format tanggal salah atau `periode` bukan `hari`/`minggu`/`bulan` (`UNPROCESSABLE_ENTITY`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /rekap/tren.php:
    get:
      tags: [Rekap]
      summary: Tren pemasukan (owner)
      description: |
        Data grafik pemasukan dan perbandingan dengan periode sebelumnya.

        | `periode` | Rentang aktif | Pembanding | Label grafik |
        |---|---|---|---|
        | `7_hari` | 7 hari terakhir (termasuk hari ini) | 7 hari sebelumnya | Nama hari (Monday, …) |
        | `minggu` | Senin–Minggu minggu berjalan | Minggu lalu | Nama hari (Monday, …) |
        | `bulan` | Bulan berjalan | Bulan lalu | 12 bulan terakhir (mis. `Oct 2026`) |

        `status_tren`: `naik`, `turun`, atau `stabil` (perubahan < 5%).
        `persentase_perubahan` bernilai `null` bila periode sebelumnya 0 tetapi periode ini ada pemasukan.
      operationId: trenPemasukan
      parameters:
        - name: periode
          in: query
          required: false
          schema:
            type: string
            enum: [7_hari, minggu, bulan]
            default: 7_hari
      responses:
        "200":
          description: Data tren
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Tren" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOwner" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "422":
          description: Periode tidak valid (`UNPROCESSABLE_ENTITY`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

# =============================================================================
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: >
        Cookie sesi PHP yang didapat dari `POST /auth/login.php`.
        Tidak perlu diisi manual — browser mengirimnya otomatis setelah login.

  parameters:
    Tanggal:
      name: tanggal
      in: query
      required: false
      description: Tanggal dengan format `YYYY-MM-DD`
      schema:
        type: string
        format: date
        example: "2026-10-25"

  responses:
    Unauthorized:
      description: |
        Belum login (`UNAUTHORIZED`) atau sesi habis setelah 30 menit tidak aktif (`UNAUTHORIZED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            belumLogin:
              summary: Belum login
              value:
                {
                  success: false,
                  message: Silakan login terlebih dahulu.,
                  error_code: UNAUTHORIZED,
                }
            sesiHabis:
              summary: Sesi berakhir
              value:
                {
                  success: false,
                  message: Sesi login telah berakhir. Silakan login kembali.,
                  error_code: UNAUTHORIZED,
                }
    ForbiddenOwner:
      description: Akses hanya untuk owner (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              success: false,
              message: Akses hanya untuk owner.,
              error_code: FORBIDDEN,
            }
    MethodNotAllowed:
      description: Method HTTP tidak didukung (`METHOD_NOT_ALLOWED`). Header `Allow` berisi method yang diizinkan.
      headers:
        Allow:
          schema: { type: string, example: GET }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Kesalahan server (`INTERNAL_SERVER_ERROR`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              success: false,
              message: Terjadi kesalahan pada server.,
              error_code: INTERNAL_SERVER_ERROR,
            }

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Pesan kesalahan }
        error_code:
          type: string
          description: Nama status HTTP respons ini (lihat tabel di deskripsi API)
          example: UNPROCESSABLE_ENTITY

    Role:
      type: string
      enum: [owner, barber]

    MetodePembayaran:
      type: string
      enum: [cash, qris, transfer]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: erik }
        password: { type: string, format: password, example: password_pengguna }

    LoginResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Login berhasil. }
        data:
          type: object
          properties:
            id_user: { type: integer, example: 1 }
            username: { type: string, example: erik }
            nama: { type: string, example: Erik }
            role: { $ref: "#/components/schemas/Role" }

    Layanan:
      type: object
      properties:
        id_layanan: { type: integer, example: 3 }
        nama_layanan: { type: string, maxLength: 100, example: Potong Rambut }
        harga: { type: integer, example: 35000 }
        hpp:
          type: integer
          nullable: true
          description: Harga pokok (HPP) layanan; boleh `null` pada data lama
          example: 5000
        aktif:
          type: integer
          enum: [0, 1]
          description: "`1` aktif, `0` nonaktif"
          example: 1
        icon_layanan:
          type: string
          nullable: true
          description: Path relatif file ikon dari root aplikasi
          example: uploads/layanan/9f2c1e7a.png

    LayananInput:
      type: object
      required: [nama_layanan, harga, hpp]
      properties:
        nama_layanan: { type: string, maxLength: 100, example: Potong Rambut }
        harga: { type: integer, minimum: 1, example: 35000 }
        hpp: { type: integer, minimum: 0, maximum: 2147483647, example: 5000 }

    LayananUpdate:
      allOf:
        - type: object
          required: [id_layanan]
          properties:
            id_layanan: { type: integer, minimum: 1, example: 3 }
        - $ref: "#/components/schemas/LayananInput"

    Pelanggan:
      type: object
      properties:
        id_pelanggan: { type: integer, example: 7 }
        nama: { type: string, example: Andi }

    RiwayatPelanggan:
      type: object
      properties:
        pelanggan: { $ref: "#/components/schemas/Pelanggan" }
        jumlah_kunjungan:
          type: integer
          description: Jumlah transaksi berbeda milik pelanggan
          example: 2
        riwayat:
          type: array
          description: Satu baris per layanan, terbaru lebih dulu
          items:
            type: object
            properties:
              id_transaksi: { type: integer, example: 12 }
              tanggal: { type: string, format: date, example: "2026-10-25" }
              waktu: { type: string, example: "15:30:00" }
              id_layanan:
                type: integer
                nullable: true
                description: "`null` bila layanan sudah dihapus permanen"
                example: 2
              nama_layanan:
                type: string
                description: Nama layanan saat transaksi (snapshot)
                example: Coloring
              jumlah: { type: integer, example: 1 }
        ada_data:
          type: boolean
          description: "`false` bila pelanggan belum memiliki riwayat"
          example: true

    TransaksiRingkas:
      type: object
      properties:
        id_transaksi: { type: integer, example: 15 }
        id_pencatat:
          { type: integer, description: User yang mencatat, example: 1 }
        id_barber:
          { type: integer, description: Barber yang melayani, example: 2 }
        nama_barber: { type: string, example: Budi }
        id_pelanggan: { type: integer, nullable: true, example: 7 }
        nama_pelanggan: { type: string, nullable: true, example: Andi }
        tanggal: { type: string, format: date, example: "2026-10-25" }
        waktu: { type: string, example: "14:32:10" }
        total_harga: { type: integer, example: 75000 }
        metode_pembayaran: { $ref: "#/components/schemas/MetodePembayaran" }
        dibuat_pada:
          { type: string, format: date-time, example: "2026-10-25 14:32:10" }

    TransaksiDetail:
      allOf:
        - $ref: "#/components/schemas/TransaksiRingkas"
        - type: object
          properties:
            layanan:
              type: array
              items:
                type: object
                properties:
                  id_layanan:
                    {
                      type: integer,
                      nullable: true,
                      description: "`null` bila layanan sudah dihapus permanen",
                      example: 1,
                    }
                  nama_layanan:
                    {
                      type: string,
                      description: Nama saat transaksi (snapshot),
                      example: Potong Rambut,
                    }
                  harga:
                    {
                      type: integer,
                      description: Harga satuan saat transaksi,
                      example: 35000,
                    }
                  hpp_saat_transaksi:
                    { type: integer, nullable: true, example: 5000 }
                  jumlah: { type: integer, example: 2 }
                  subtotal:
                    {
                      type: integer,
                      description: harga × jumlah,
                      example: 70000,
                    }

    TransaksiCreate:
      type: object
      required: [nama_pelanggan, metode_pembayaran, layanan]
      properties:
        nama_pelanggan:
          type: string
          maxLength: 100
          description: Wajib. Dipakai membuat pelanggan baru bila `id_pelanggan` kosong
          example: Andi
        id_pelanggan:
          type: integer
          nullable: true
          minimum: 1
          description: ID pelanggan yang dipilih dari pencarian; kosongkan untuk pelanggan baru
        id_barber:
          type: integer
          minimum: 1
          description: Wajib bila yang mencatat **owner**; diabaikan untuk barber
          example: 2
        metode_pembayaran: { $ref: "#/components/schemas/MetodePembayaran" }
        layanan:
          type: array
          minItems: 1
          items:
            type: object
            required: [id_layanan]
            properties:
              id_layanan: { type: integer, minimum: 1, example: 1 }
              jumlah:
                type: integer
                minimum: 1
                maximum: 100
                default: 1
                example: 1

    TransaksiCreated:
      type: object
      properties:
        id_transaksi: { type: integer, example: 16 }
        id_pencatat: { type: integer, example: 1 }
        id_barber: { type: integer, example: 2 }
        id_pelanggan: { type: integer, example: 8 }
        tanggal: { type: string, format: date, example: "2026-10-25" }
        waktu: { type: string, example: "14:40:02" }
        total_harga: { type: integer, example: 105000 }
        metode_pembayaran: { $ref: "#/components/schemas/MetodePembayaran" }
        layanan:
          type: array
          items:
            type: object
            properties:
              id_layanan: { type: integer, example: 1 }
              nama_layanan: { type: string, example: Potong Rambut }
              harga: { type: integer, example: 35000 }
              hpp_saat_transaksi:
                { type: integer, nullable: true, example: 5000 }
              jumlah: { type: integer, example: 1 }

    Pengeluaran:
      type: object
      properties:
        id_pengeluaran: { type: integer, example: 12 }
        kategori: { type: string, example: Listrik }
        nominal: { type: integer, example: 150000 }
        tanggal: { type: string, format: date, example: "2026-10-25" }
        keterangan:
          { type: string, nullable: true, example: Token listrik bulan Oktober }
        dibuat_pada:
          { type: string, format: date-time, example: "2026-10-25 09:15:00" }

    PengeluaranInput:
      type: object
      required: [kategori, nominal]
      properties:
        kategori: { type: string, maxLength: 100, example: Listrik }
        nominal:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 150000
        tanggal:
          type: string
          format: date
          description: Default hari ini (WIB)
          example: "2026-10-25"
        keterangan:
          type: string
          nullable: true
          maxLength: 255
          example: Token listrik bulan Oktober

    Tren:
      type: object
      properties:
        periode:
          { type: string, enum: [7_hari, minggu, bulan], example: 7_hari }
        tanggal_awal: { type: string, format: date, example: "2026-10-19" }
        tanggal_akhir: { type: string, format: date, example: "2026-10-25" }
        labels:
          type: array
          items: { type: string }
          example:
            [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
        pemasukan:
          type: array
          description: Nilai pemasukan, urutan sama dengan `labels`
          items: { type: integer }
          example: [120000, 95000, 0, 210000, 175000, 300000, 150000]
        total_pemasukan: { type: integer, example: 1050000 }
        total_periode_sebelumnya: { type: integer, example: 900000 }
        persentase_perubahan:
          type: number
          nullable: true
          description: "`null` bila periode sebelumnya 0 sementara periode ini > 0"
          example: 16.67
        status_tren:
          { type: string, enum: [naik, turun, stabil], example: naik }
        ada_data:
          {
            type: boolean,
            description: "`false` bila seluruh nilai pemasukan 0",
            example: true,
          }
